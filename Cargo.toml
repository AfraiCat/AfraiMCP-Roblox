[package]
name = "rbx-studio-mcp"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
rmcp = { version = "0.14", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.8", features = ["macros"] }
# multipart needed for the Open Cloud assets upload endpoint;
# rustls so we don't pull in OpenSSL on Windows (reqwest 0.13 renamed the
# `rustls-tls` feature to `rustls`).
reqwest = { version = "0.13", features = ["json", "multipart", "form", "rustls"], default-features = false }
color-eyre = "0.6"
clap = { version = "4.5.37", features = ["derive"] }
roblox_install = "1.0.0"
# OAuth + Open Cloud
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
dirs = "5"
open = "5"
urlencoding = "2"
time = { version = "0.3", features = ["serde", "macros", "formatting"] }
# Upload policy: HMAC signature, glob rules, hex for signatures and hashes.
hmac = "0.12"
globset = "0.4"
hex = "0.4"
# Hidden prompt for `set-key` (the key is never a CLI argument or env var).
rpassword = "7"

# Windows DPAPI (CryptProtectData) backs the secret store; no size limit, unlike
# Credential Manager blobs, and nothing is written in plaintext.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
native-dialog = "0.9"
security-translocate = "0.2.1"
core-foundation = "0.10.0"

[build-dependencies]
rojo = "7.6.1"

[package.metadata.bundle]
name = "RobloxStudioMCP"
short_description = "Model Context Protocol server for Roblox Studio"
identifier = "com.rbx-mcp.server"
